name: "Run Experiment"
on: 
  workflow_dispatch:
    inputs:
      k3s_master_ip:
        description: "Master node IP"
        required: true
      experiment_type:
        options:
          - pod_kill
          - cpu_stress
          - memory_stress
          - network_delay
        type: choice
        description: Experiment to choose
        required: true  
jobs:
  Experiment:
    name: "Run Experiment"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Copy file via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ inputs.k3s_master_ip }}
          username: root
          key: ${{ secrets.CHAOS_SSH_PRIVATE_KEY }}
          source: "Chaos_experiment/run-experiment.sh"
          target: "/tmp/"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CHAOS_SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

      - name: Execute experiment
        run: |
          OUTPUT=$(ssh -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            root@${{ inputs.k3s_master_ip }} \
            "chmod +x /tmp/Chaos_experiment/run-experiment.sh && /tmp/Chaos_experiment/run-experiment.sh ${{ inputs.experiment_type }}")
          echo "$OUTPUT"
          
          JOB_NAME=$(echo "$OUTPUT" | grep "✅ Job" | grep -oP 'chaos-\d+')
          echo "JOB_NAME=$JOB_NAME" >> $GITHUB_ENV

      - name: Wait for job to complete
        run: |
          ssh -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            root@${{ inputs.k3s_master_ip }} \
            "kubectl wait job/${{ env.JOB_NAME }} \
              --for=condition=complete \
              --timeout=900s \
              -n chaos-testing || \
             kubectl wait job/${{ env.JOB_NAME }} \
              --for=condition=failed \
              --timeout=10s \
              -n chaos-testing || true"

      - name: Collect logs from PVC
        run: |
          ssh -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            root@${{ inputs.k3s_master_ip }} \
            'LOGFILE=$(kubectl run log-reader --rm -i --restart=Never \
              --image=busybox \
              --overrides='"'"'{"spec":{"nodeSelector":{"kubernetes.io/hostname":"k3s-worker-node2"},"volumes":[{"name":"logs","persistentVolumeClaim":{"claimName":"chaos-agent-logs"}}],"containers":[{"name":"log-reader","image":"busybox","command":["ls","-t","/logs"],"volumeMounts":[{"name":"logs","mountPath":"/logs"}]}]}}'"'"' \
              -n chaos-testing 2>/dev/null | head -1) && \
            kubectl run log-reader2 --rm -i --restart=Never \
              --image=busybox \
              --overrides="{\"spec\":{\"nodeSelector\":{\"kubernetes.io/hostname\":\"k3s-worker-node2\"},\"volumes\":[{\"name\":\"logs\",\"persistentVolumeClaim\":{\"claimName\":\"chaos-agent-logs\"}}],\"containers\":[{\"name\":\"log-reader\",\"image\":\"busybox\",\"command\":[\"cat\",\"/logs/${LOGFILE}\"],\"volumeMounts\":[{\"name\":\"logs\",\"mountPath\":\"/logs\"}]}]}}" \
              -n chaos-testing 2>/dev/null' > chaos-run.log
          
          echo "=== Log preview ==="
          tail -20 chaos-run.log

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs-${{ env.JOB_NAME }}
          path: chaos-run.log
          retention-days: 30

      - name: Create GitHub Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('chaos-run.log', 'utf8');
            const tail = log.slice(-8000);
            const artifactUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Chaos Experiment: ${{ inputs.experiment_type }} – ${{ env.JOB_NAME }}`,
              body: [
                `## Chaos Experiment Report`,
                `**Type:** \`${{ inputs.experiment_type }}\``,
                `**Job:** \`${{ env.JOB_NAME }}\``,
                `**Run:** [Actions #${{ github.run_id }}](${artifactUrl})`,
                ``,
                `> 📎 Pełne logi dostępne jako [artifact](${artifactUrl}) przez 30 dni`,
                ``,
                `### Log (ostatnie 8000 znaków)`,
                `\`\`\``,
                tail,
                `\`\`\``
              ].join('\n')
            });
