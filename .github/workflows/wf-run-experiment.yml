name: "Run Experiment"

on: 
  workflow_dispatch:
    inputs:
      k3s_master_ip:
        description: "Master node IP"
        required: true
      experiment_type:
        options:
          - pod_kill
          - cpu_stress
          - memory_stress
          - network_delay
        type: choice
        description: Experiment to choose
        required: true  

jobs:
  Experiment:
    name: "Run Experiment"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Copy file via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ inputs.k3s_master_ip }}
          username: root
          key: ${{ secrets.CHAOS_SSH_PRIVATE_KEY }}
          source: "Chaos_experiment/run-experiment.sh"
          target: "/tmp/"


      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CHAOS_SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key
          
      - name: Execute experiment
        run: |
          OUTPUT=$(ssh -i ~/.ssh/ssh_key \
            -o StrictHostKeyChecking=no \
            root@${{ inputs.k3s_master_ip }} \
            "chmod +x /tmp/Chaos_experiment/run-experiment.sh && /tmp/Chaos_experiment/run-experiment.sh ${{ inputs.experiment_type }}")
          echo "$OUTPUT"
          echo "OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Experiment result: ${{ inputs.experiment_type }}",
              body: `### Output:\n\n\`\`\`\n${process.env.OUTPUT}\n\`\`\``
            })


    
