---
# roles/chaos-agent/tasks/main.yaml
# Deploys the Chaos Engineering AI Agent to the k3s cluster

- name: Copy k8s manifests to master
  copy:
    src: chaos-agent-k3s.yaml
    dest: /tmp/chaos-agent-k3s.yaml

- name: Apply RBAC
  command: kubectl apply -f /tmp/chaos-agent-k3s.yaml

- name: Create volume for logs
  command: kubectl apply -f /tmp/chaos-agent-k3s-pvc.yaml

- name: Create chaos-agent secrets
  shell: >
    kubectl create secret generic chaos-agent-secrets
    --from-literal=anthropic-api-key={{ anthropic_api_key }}
    --from-literal=slack-webhook-url={{ slack_webhook_url }}
    -n chaos-testing
    --dry-run=client -o yaml | kubectl apply -f -
#  no_log: true   # Do not log API keys

