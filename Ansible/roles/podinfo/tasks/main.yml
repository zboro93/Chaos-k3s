---
# tasks file for podinfo
- name: Add repository to Helm
  command: helm repo add podinfo https://stefanprodan.github.io/podinfo

- name: upadte repo
  command: helm repo update

- name: label app node
  command: kubectl label node k3s-worker-node1 role=app-node

- name: intall podinfo
  command: helm upgrade
    --install podinfo podinfo/podinfo
    --namespace app-production
    --create-namespace
    --set service.type=NodePort
    --set service.nodePort=30080
    --set nodeSelector."role"=app-node

- name: check pod
  command: kubectl get pods -n app-production
  register: podinfoPodStatus
  until: "'Running' in podinfoPodStatus.stdout"
  retries: 10
  delay: 10
